<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Team – Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#14213D; --muted:#5B6678; --line:#D3D9E2;
  --uk:#1F3FBF; --uk-soft:#E3E8FB; --local:#0E8A5F; --local-soft:#DDF3EA; --bad:#B3261E; --ok:#0E8A5F;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0F1626; --card:#18213A; --ink:#EDF1F8; --muted:#9AA6BC; --line:#2B3756;
  --uk:#8FA6FF; --uk-soft:#1E2B5C; --local:#4FD1A0; --local-soft:#143B30; --bad:#FF8A80; --ok:#4FD1A0;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font:800 clamp(2rem,7vw,3.2rem)/1.02 "Bricolage Grotesque",sans-serif;margin:0 0 10px;letter-spacing:-.02em}
.lede{color:var(--muted);margin:0 0 22px;max-width:48ch}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;display:block;text-align:center;text-decoration:none;padding:12px 6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:600 14px "Instrument Sans",sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
label,.lbl{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.opt input:focus-visible+span{outline:3px solid var(--uk);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:16px 6px;border:2px solid var(--line);border-radius:12px;font-weight:600;background:var(--paper)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.opt input:checked+span.uk{border-color:var(--uk);background:var(--uk-soft)}
.opt input:checked+span.local{border-color:var(--local);background:var(--local-soft)}
.opt input:checked+span.both{border-color:var(--ink);background:linear-gradient(90deg,var(--uk-soft) 50%,var(--local-soft) 50%)}
.go{margin-top:22px;width:100%;padding:15px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);font:700 16px "Instrument Sans",sans-serif;cursor:pointer}
.go[disabled]{opacity:.55;cursor:wait}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
.msg.show{display:block}
.msg.ok{background:var(--local-soft);color:var(--ok)}
.msg.err{background:#FDE7E5;color:var(--bad)}
@media(prefers-color-scheme:dark){.msg.err{background:#4A1F1C}}
.msg.warn{background:#FFF3CD;color:#7A5B00}
.hidden{display:none}
@media(prefers-reduced-motion:no-preference){.go{transition:transform .1s}.go:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Join the team</h1>
  <p class="lede">Tell us who you are and which campaign you want to work on. We’ll be in touch.</p>

  <div id="cfgWarn" class="msg warn hidden"></div>

  <div class="tabs">
    <button class="tab" id="tApply" aria-selected="true" type="button">Add applicant</button>
    <a class="tab" href="profiles.html" aria-selected="false">Profiles</a>
    <a class="tab" href="manage.html" aria-selected="false">Manage</a>
  </div>

  <section class="card">
    <form id="f" novalidate>
      <div class="row">
        <div><label for="name">Name</label><input id="name" autocomplete="given-name" required></div>
        <div><label for="surname">Surname</label><input id="surname" autocomplete="family-name" required></div>
      </div>
      <label for="address">Address</label>
      <input id="address" autocomplete="street-address" required>
      <div class="row">
        <div><label for="number">Phone number</label><input id="number" type="tel" autocomplete="tel" required></div>
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="row">
        <div><label for="years">Years of experience</label>
          <select id="years"></select></div>
        <div><label for="months">Months</label>
          <select id="months"></select></div>
      </div>
      <label for="experience">Work experience</label>
      <textarea id="experience" placeholder="Previous jobs, roles and what you did" required></textarea>

      <div class="lbl">Campaign</div>
      <div class="opts" role="radiogroup" aria-label="Campaign">
        <label class="opt"><input type="radio" name="campaign" value="UK"><span class="uk">UK</span></label>
        <label class="opt"><input type="radio" name="campaign" value="Local"><span class="local">Local</span></label>
        <label class="opt"><input type="radio" name="campaign" value="Both"><span class="both">Both<small>UK + Local</small></span></label>
      </div>

      <button class="go" id="go" type="submit">Save applicant</button>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, COLLECTION } from "./firebase-config.js";

const $ = id => document.getElementById(id);
const configured = !JSON.stringify(firebaseConfig).includes("PASTE_");
let db = null;

function showMsg(kind, text) {
  const m = $("msg");
  m.className = "msg show " + kind;
  m.textContent = text;
}

if (!configured) {
  $("cfgWarn").textContent = "Firebase isn’t connected yet. Paste your Firebase config into firebase-config.js.";
  $("cfgWarn").classList.remove("hidden");
} else {
  try { db = getFirestore(initializeApp(firebaseConfig)); }
  catch (e) { showMsg("err", "Firebase failed to start: " + e.message); }
}

$("years").innerHTML = Array.from({length: 31}, (_, i) => `<option value="${i}">${i === 30 ? "30+" : i} ${i === 1 ? "year" : "years"}</option>`).join("");
$("months").innerHTML = Array.from({length: 12}, (_, i) => `<option value="${i}">${i} ${i === 1 ? "month" : "months"}</option>`).join("");

function friendlyError(e) {
  const code = e.code || "";
  if (code === "permission-denied") return "Firebase refused the save (permission-denied). In Firebase Console → Firestore → Rules, allow creating documents in “" + COLLECTION + "”.";
  if (code === "not-found" || code === "failed-precondition") return "Firestore database not found. In Firebase Console → Build → Firestore Database, click Create database.";
  if (code === "unavailable" || e.message === "timeout") return "Couldn’t reach Firebase within 12 seconds. Check your internet and that the Firestore database exists, then try again.";
  if (code === "invalid-argument") return "Firebase config looks wrong. Re-copy it from Project settings.";
  return "Save failed: " + (code || e.message || e);
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("msg").className = "msg";
  const campaign = (document.querySelector('input[name="campaign"]:checked') || {}).value;
  const data = {
    name: $("name").value.trim(),
    surname: $("surname").value.trim(),
    address: $("address").value.trim(),
    number: $("number").value.trim(),
    email: $("email").value.trim(),
    experienceYears: +$("years").value,
    experienceMonths: +$("months").value,
    experience: $("experience").value.trim(),
    campaign
  };
  if (!data.name || !data.surname || !data.address || !data.number || !data.email || !data.experience)
    return showMsg("err", "Please fill in every field.");
  if (!/^\S+@\S+\.\S+$/.test(data.email)) return showMsg("err", "Enter a valid email address.");
  if (!campaign) return showMsg("err", "Choose UK, Local or Both.");
  if (!db) return showMsg("err", "Firebase isn’t connected yet, so nothing was saved.");

  data.campaigns = { UK: campaign !== "Local", Local: campaign !== "UK" };
  data.createdAt = serverTimestamp();

  $("go").disabled = true; $("go").textContent = "Saving…";
  try {
    await Promise.race([
      addDoc(collection(db, COLLECTION), data),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000))
    ]);
    $("f").reset();
    showMsg("ok", "Applicant saved. Thank you, " + data.name + "!");
  } catch (e) {
    console.error("Firestore save error:", e);
    showMsg("err", friendlyError(e));
  } finally {
    $("go").disabled = false; $("go").textContent = "Save applicant";
  }
});

$("tApply").onclick = () => location.reload();
</script>
</body>
</html>
