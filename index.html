<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Capture</title>
<style>
  :root{
    --bg:#fcd6e5; --card:#ffeaf2; --input:#ffffff; --line:#f4b3cc;
    --text:#4a2a2a; --muted:#8e5a5a; --accent:#a35a66; --accentSoft:#ffdbe8; --btn:#a35a66; --btnText:#ffffff;
    --ok:#e3f3e8; --okText:#14683f; --err:#ffd9df; --errText:#a1102e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 14px;color:var(--accent)}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .tab{background:var(--input);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:16px 6px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
  .tab.active{background:#ffffff;color:var(--accent);border-color:var(--accent)}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
  .hidden{display:none}
  label{display:block;font-weight:600;margin:16px 0 8px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;background:var(--input);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  input::placeholder,textarea::placeholder{color:#d9a9bd}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .camp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .camp button{background:var(--input);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:16px 6px;font-size:16px;font-weight:600;cursor:pointer}
  .camp button small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
  .camp button.sel{border-color:var(--accent);background:var(--accentSoft)}
  .save{width:100%;margin-top:22px;background:var(--btn);color:var(--btnText);border:0;border-radius:16px;padding:18px;font-size:19px;font-weight:700;cursor:pointer}
  .save:disabled{opacity:.6}
  .msg{margin-top:14px;padding:14px;border-radius:14px;font-size:17px;transition:opacity .5s}
  .msg.ok{background:var(--ok);color:var(--okText)}
  .msg.err{background:var(--err);color:var(--errText)}
  .count{color:var(--muted);margin:0 0 12px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .chip{background:var(--input);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:17px;font-weight:600;cursor:pointer}
  .chip.active{background:var(--btn);color:var(--btnText);border-color:var(--btn)}
  .letter{font-size:28px;font-weight:800;color:var(--accent);margin:22px 0 10px}
  .person{background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px;border-bottom:2px solid var(--line);flex-wrap:wrap}
  .ph b{font-size:20px}
  .badges{display:flex;gap:8px}
  .badge{border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;color:var(--muted)}
  .badge.on{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}
  .pb{padding:16px}
  .pb .k{color:var(--muted);font-weight:600;margin-top:14px}
  .pb .k:first-child{margin-top:0}
  .pb .v{font-size:18px;word-break:break-word;white-space:pre-wrap}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .replay{background:var(--input);color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;margin:0 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Recruitment Capture</h1>
  <button class="replay" id="replayWelcome" type="button">🔊 Replay welcome</button>

  <div class="tabs">
    <button class="tab active" id="tabAdd" type="button">Add applicant</button>
    <button class="tab" id="tabProfiles" type="button">Profiles</button>
    <a class="tab" href="manage.html">Manage</a>
  </div>

  <!-- ADD APPLICANT -->
  <div class="panel" id="addPanel">
    <form id="applicantForm" novalidate>
      <label for="firstName">Name</label>
      <input id="firstName" type="text" autocomplete="given-name" placeholder="First name">

      <label for="surname">Surname</label>
      <input id="surname" type="text" autocomplete="family-name" placeholder="Surname">

      <label for="phone">Phone number</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+27...">

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@email.com">

      <label for="address">Address</label>
      <input id="address" type="text" autocomplete="street-address" placeholder="Street, suburb">

      <div class="row">
        <div>
          <label for="years">Years of experience</label>
          <select id="years"></select>
        </div>
        <div>
          <label for="months">Months</label>
          <select id="months"></select>
        </div>
      </div>

      <label for="experience">Work experience</label>
      <textarea id="experience" placeholder="Previous jobs, roles and what you did"></textarea>

      <label>Campaign</label>
      <div class="camp" id="camp">
        <button type="button" data-v="UK">UK</button>
        <button type="button" data-v="Local">Local</button>
        <button type="button" data-v="Both">Both<small>UK + Local</small></button>
      </div>

      <button class="save" id="saveBtn" type="submit">Save applicant</button>
      <div id="msg" class="msg hidden"></div>
    </form>
  </div>

  <!-- PROFILES -->
  <div id="profilesPanel" class="hidden">
    <p class="count" id="count"></p>
    <input id="search" type="search" placeholder="Search by name, surname, email or number">
    <div class="chips" id="filters">
      <button class="chip active" type="button" data-f="All">All</button>
      <button class="chip" type="button" data-f="UK">UK</button>
      <button class="chip" type="button" data-f="Local">Local</button>
      <button class="chip" type="button" data-f="Both">Both</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script type="module">
  import * as cfg from "./firebase-config.js";
  import { collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const db = cfg.db || cfg.default;
  const COLLECTION = "applicants"; // change this if your existing data lives in a different collection

  const $ = (id) => document.getElementById(id);
  const form = $("applicantForm");
  const msg = $("msg");
  let campaign = "";
  let people = [];
  let filter = "All";
  let msgTimer;

  // WELCOME VOICE (browsers only allow sound after the first tap)
  const WELCOME_TEXT = "Welcome to Zaaaah recruiter. Owned by Mclaren Money-Tization.";
  let welcomed = false;

  function speakWelcome() {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(WELCOME_TEXT);
    u.rate = 0.95;
    u.lang = "en-GB";
    window.speechSynthesis.speak(u);
  }

  function welcomeOnce() {
    if (welcomed) return;
    welcomed = true;
    speakWelcome();
  }

  document.addEventListener("pointerdown", welcomeOnce, { once: true });
  document.addEventListener("keydown", welcomeOnce, { once: true });
  $("replayWelcome").addEventListener("click", (e) => {
    e.stopPropagation();
    welcomed = true;
    speakWelcome();
  });

  // Dropdowns
  $("years").innerHTML = Array.from({length: 41}, (_, i) => `<option value="${i}">${i} year${i === 1 ? "" : "s"}</option>`).join("");
  $("months").innerHTML = Array.from({length: 12}, (_, i) => `<option value="${i}">${i} month${i === 1 ? "" : "s"}</option>`).join("");

  // Campaign picker
  $("camp").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    campaign = b.dataset.v;
    document.querySelectorAll("#camp button").forEach((x) => x.classList.toggle("sel", x === b));
  });

  function showMsg(text, type) {
    clearTimeout(msgTimer);
    msg.textContent = text;
    msg.className = "msg " + type;
    msg.style.opacity = 1;
    msgTimer = setTimeout(() => {
      msg.style.opacity = 0;
      setTimeout(() => msg.classList.add("hidden"), 500);
    }, 4000);
  }

  // SAVE
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); // stops the page from refreshing

    const firstName = $("firstName").value.trim();
    const surname = $("surname").value.trim();
    const phone = $("phone").value.trim();
    const email = $("email").value.trim();

    if (!firstName || !surname) return showMsg("Please enter name and surname.", "err");
    if (!phone) return showMsg("Please enter a phone number.", "err");
    if (!email || !email.includes("@")) return showMsg("Please enter a valid email.", "err");
    if (!campaign) return showMsg("Please choose a campaign: UK, Local or Both.", "err");
    if (!db) return showMsg("Firebase isn't connected. Check firebase-config.js.", "err");

    const btn = $("saveBtn");
    btn.disabled = true;
    btn.textContent = "Saving...";

    try {
      await addDoc(collection(db, COLLECTION), {
        firstName,
        surname,
        phone,
        email,
        address: $("address").value.trim(),
        years: Number($("years").value),
        months: Number($("months").value),
        experience: $("experience").value.trim(),
        campaign,
        uk: campaign === "UK" || campaign === "Both",
        local: campaign === "Local" || campaign === "Both",
        createdAt: serverTimestamp()
      });

      // Only runs after the save succeeded
      form.reset();
      campaign = "";
      document.querySelectorAll("#camp button").forEach((x) => x.classList.remove("sel"));
      showMsg(`Applicant saved. Thank you, ${firstName}!`, "ok");
    } catch (err) {
      console.error(err);
      showMsg("Could not save: " + (err.message || "unknown error"), "err");
    } finally {
      btn.disabled = false;
      btn.textContent = "Save applicant";
    }
  });

  // TABS
  function show(tab) {
    const profiles = tab === "profiles";
    $("addPanel").classList.toggle("hidden", profiles);
    $("profilesPanel").classList.toggle("hidden", !profiles);
    $("tabAdd").classList.toggle("active", !profiles);
    $("tabProfiles").classList.toggle("active", profiles);
    if (profiles) loadProfiles();
  }
  $("tabAdd").addEventListener("click", () => show("add"));
  $("tabProfiles").addEventListener("click", () => show("profiles"));

  // PROFILES
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function normalise(d) {
    const uk = d.uk ?? (d.campaign === "UK" || d.campaign === "Both");
    const local = d.local ?? (d.campaign === "Local" || d.campaign === "Both");
    return {
      first: d.firstName || d.name || "",
      surname: d.surname || "",
      phone: d.phone || d.number || "",
      email: d.email || "",
      address: d.address || "",
      years: d.years ?? d.yearsExperience ?? 0,
      months: d.months ?? 0,
      history: d.experience || d.workExperience || d.workHistory || "",
      uk: !!uk,
      local: !!local
    };
  }

  async function loadProfiles() {
    $("list").innerHTML = '<div class="empty">Loading...</div>';
    try {
      const snap = await getDocs(collection(db, COLLECTION));
      people = snap.docs.map((d) => normalise(d.data()));
      people.sort((a, b) => (a.surname + a.first).localeCompare(b.surname + b.first));
      render();
    } catch (err) {
      console.error(err);
      $("list").innerHTML = `<div class="empty">Could not load profiles: ${esc(err.message)}</div>`;
    }
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const shown = people.filter((p) => {
      const campOk =
        filter === "All" ||
        (filter === "UK" && p.uk && !p.local) ||
        (filter === "Local" && p.local && !p.uk) ||
        (filter === "Both" && p.uk && p.local);
      const text = `${p.first} ${p.surname} ${p.email} ${p.phone}`.toLowerCase();
      return campOk && (!q || text.includes(q));
    });

    $("count").textContent = `${shown.length} of ${people.length} ${people.length === 1 ? "person" : "people"}`;

    if (!shown.length) {
      $("list").innerHTML = '<div class="empty">No applicants found.</div>';
      return;
    }

    let html = "";
    let lastLetter = "";
    for (const p of shown) {
      const letter = (p.surname || p.first || "#").charAt(0).toUpperCase();
      if (letter !== lastLetter) {
        html += `<div class="letter">${esc(letter)}</div>`;
        lastLetter = letter;
      }
      html += `
        <div class="person">
          <div class="ph">
            <b>${esc(p.surname)}, ${esc(p.first)}</b>
            <div class="badges">
              <span class="badge ${p.uk ? "on" : ""}">UK${p.uk ? "" : " – no"}</span>
              <span class="badge ${p.local ? "on" : ""}">Local${p.local ? "" : " – no"}</span>
            </div>
          </div>
          <div class="pb">
            <div class="k">Phone</div><div class="v">${esc(p.phone)}</div>
            <div class="k">Email</div><div class="v">${esc(p.email)}</div>
            <div class="k">Address</div><div class="v">${esc(p.address)}</div>
            <div class="k">Experience</div><div class="v">${esc(p.years)} years ${esc(p.months)} months</div>
            <div class="k">Work history</div><div class="v">${esc(p.history)}</div>
          </div>
        </div>`;
    }
    $("list").innerHTML = html;
  }

  $("search").addEventListener("input", render);
  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#filters .chip").forEach((x) => x.classList.toggle("active", x === b));
    render();
  });
</script>
</body>
</html>
