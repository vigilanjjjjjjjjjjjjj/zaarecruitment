<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Employees – Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#14213D; --muted:#5B6678; --line:#D3D9E2;
  --uk:#1F3FBF; --uk-soft:#E3E8FB; --local:#0E8A5F; --local-soft:#DDF3EA; --bad:#B3261E;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0F1626; --card:#18213A; --ink:#EDF1F8; --muted:#9AA6BC; --line:#2B3756;
  --uk:#8FA6FF; --uk-soft:#1E2B5C; --local:#4FD1A0; --local-soft:#143B30; --bad:#FF8A80;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font:800 clamp(2rem,7vw,3.2rem)/1.02 "Bricolage Grotesque",sans-serif;margin:0 0 6px;letter-spacing:-.02em}
.count{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;display:block;text-align:center;text-decoration:none;padding:12px 6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:600 14px "Instrument Sans",sans-serif}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=search]{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--uk);outline-offset:2px}
.filters{display:flex;gap:8px;margin:12px 0 22px;flex-wrap:wrap}
.f{padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);font:600 14px "Instrument Sans",sans-serif;cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.letter{font:800 1.4rem "Bricolage Grotesque",sans-serif;margin:24px 0 8px;color:var(--muted)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;font-weight:600}
summary::-webkit-details-marker{display:none}
.nm{min-width:0;overflow-wrap:anywhere}
.camps{display:flex;gap:6px;flex-shrink:0}
.chip{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.chip.uk.on{background:var(--uk-soft);border-color:var(--uk);color:var(--uk)}
.chip.local.on{background:var(--local-soft);border-color:var(--local);color:var(--local)}
.detail{padding:0 16px 16px;font-size:14px;border-top:1px solid var(--line)}
.detail p{margin:10px 0 0;overflow-wrap:anywhere}
.detail b{display:block;color:var(--muted);font-weight:600;font-size:12px}
.exp{white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.err{background:#FDE7E5;color:var(--bad);padding:12px 14px;border-radius:10px;font-size:14px}
@media(prefers-color-scheme:dark){.err{background:#4A1F1C}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Future employees</h1>
  <p class="count" id="count">Loading…</p>

  <div class="tabs">
    <a class="tab" href="index.html" aria-selected="false">Add applicant</a>
    <a class="tab" href="profiles.html" aria-selected="true">Profiles</a>
    <a class="tab" href="manage.html" aria-selected="false">Manage</a>
  </div>

  <input type="search" id="q" placeholder="Search by name, surname, email or number" aria-label="Search employees">
  <div class="filters" id="filters">
    <button class="f" data-f="all" aria-pressed="true">All</button>
    <button class="f" data-f="UK" aria-pressed="false">UK</button>
    <button class="f" data-f="Local" aria-pressed="false">Local</button>
    <button class="f" data-f="Both" aria-pressed="false">Both</button>
  </div>

  <div id="catalog"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, COLLECTION } from "./firebase-config.js";

const $ = id => document.getElementById(id);
let people = [], filter = "all";

function friendlyError(e) {
  const code = e.code || "";
  if (code === "permission-denied") return "Firebase refused the read (permission-denied). In Firebase Console → Firestore → Rules, allow reading “" + COLLECTION + "”.";
  if (code === "not-found" || code === "failed-precondition") return "Firestore database not found. In Firebase Console → Build → Firestore Database, click Create database.";
  if (code === "unavailable" || e.message === "timeout") return "Couldn’t reach Firebase within 12 seconds. Check your internet and try again.";
  return "Couldn’t load profiles: " + (code || e.message || e);
}

function fail(text) {
  $("count").textContent = "";
  const d = document.createElement("div");
  d.className = "err"; d.textContent = text;
  $("catalog").replaceChildren(d);
}

function chip(label, cls, on) {
  const s = document.createElement("span");
  s.className = "chip " + cls + (on ? " on" : "");
  s.textContent = on ? label : label + " – no";
  return s;
}

function field(label, value, cls) {
  const p = document.createElement("p");
  if (cls) p.className = cls;
  const b = document.createElement("b"); b.textContent = label;
  p.append(b, document.createTextNode(value));
  return p;
}

function matches(p) {
  const q = $("q").value.trim().toLowerCase();
  const hay = [p.name, p.surname, p.email, p.number].join(" ").toLowerCase();
  if (q && !hay.includes(q)) return false;
  if (filter === "UK") return p.c.UK;
  if (filter === "Local") return p.c.Local;
  if (filter === "Both") return p.c.UK && p.c.Local;
  return true;
}

function render() {
  const box = $("catalog");
  const list = people.filter(matches);
  $("count").textContent = list.length + " of " + people.length + (people.length === 1 ? " person" : " people");
  if (!list.length) {
    const e = document.createElement("p");
    e.className = "empty";
    e.textContent = people.length ? "No one matches that search." : "No applicants saved yet. Add one on the first page.";
    box.replaceChildren(e);
    return;
  }
  const out = [];
  let last = "";
  list.forEach(p => {
    const letter = (p.surname || p.name || "#").charAt(0).toUpperCase();
    if (letter !== last) {
      const h = document.createElement("h2");
      h.className = "letter"; h.textContent = letter;
      out.push(h); last = letter;
    }
    const d = document.createElement("details");
    const s = document.createElement("summary");
    const n = document.createElement("span");
    n.className = "nm"; n.textContent = (p.surname || "") + ", " + (p.name || "");
    const camps = document.createElement("span");
    camps.className = "camps";
    camps.append(chip("UK", "uk", p.c.UK), chip("Local", "local", p.c.Local));
    s.append(n, camps);
    const det = document.createElement("div");
    det.className = "detail";
    det.append(
      field("Phone", p.number || "–"),
      field("Email", p.email || "–"),
      field("Address", p.address || "–"),
      field("Experience", (p.experienceYears ?? 0) + " years " + (p.experienceMonths ?? 0) + " months"),
      field("Work history", p.experience || "–", "exp")
    );
    d.append(s, det);
    out.push(d);
  });
  box.replaceChildren(...out);
}

$("q").addEventListener("input", render);
$("filters").addEventListener("click", e => {
  const b = e.target.closest(".f");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".f").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

async function load() {
  if (JSON.stringify(firebaseConfig).includes("PASTE_"))
    return fail("Firebase isn’t connected yet. Paste your Firebase config into firebase-config.js.");
  try {
    const db = getFirestore(initializeApp(firebaseConfig));
    const snap = await Promise.race([
      getDocs(collection(db, COLLECTION)),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000))
    ]);
    people = snap.docs.map(d => {
      const p = d.data();
      p.c = p.campaigns || { UK: p.campaign !== "Local", Local: p.campaign !== "UK" };
      return p;
    }).sort((a, b) =>
      ((a.surname || "") + (a.name || "")).localeCompare((b.surname || "") + (b.name || ""), undefined, { sensitivity: "base" }));
    render();
  } catch (e) {
    console.error("Firestore read error:", e);
    fail(friendlyError(e));
  }
}
load();
</script>
</body>
</html>
