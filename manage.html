<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Applicants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#14213D; --muted:#5B6678; --line:#D3D9E2;
  --uk:#1F3FBF; --uk-soft:#E3E8FB; --local:#0E8A5F; --local-soft:#DDF3EA; --bad:#B3261E; --ok:#0E8A5F;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0F1626; --card:#18213A; --ink:#EDF1F8; --muted:#9AA6BC; --line:#2B3756;
  --uk:#8FA6FF; --uk-soft:#1E2B5C; --local:#4FD1A0; --local-soft:#143B30; --bad:#FF8A80; --ok:#4FD1A0;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font:800 clamp(2rem,7vw,3.2rem)/1.02 "Bricolage Grotesque",sans-serif;margin:0 0 18px;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;display:block;text-align:center;text-decoration:none;padding:12px 6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:600 14px "Instrument Sans",sans-serif}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--uk);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font:800 1.8rem/1.1 "Bricolage Grotesque",sans-serif}
.stat span{font-size:12px;color:var(--muted)}
.stat.uk b{color:var(--uk)} .stat.local b{color:var(--local)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
@media(max-width:520px){.bar{grid-template-columns:1fr}}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.bar input,.bar select{background:var(--card)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;font-weight:600}
summary::-webkit-details-marker{display:none}
.nm{min-width:0;overflow-wrap:anywhere}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.camps{display:flex;gap:6px;flex-shrink:0}
.chip{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.chip.uk.on{background:var(--uk-soft);border-color:var(--uk);color:var(--uk)}
.chip.local.on{background:var(--local-soft);border-color:var(--local);color:var(--local)}
.detail{padding:4px 16px 16px;border-top:1px solid var(--line)}
.track{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-bottom:6px}
@media(max-width:520px){.track{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);margin:12px 0 0;cursor:pointer}
.sw input{width:22px;height:22px;margin:0;accent-color:var(--local)}
.sub{font:800 1.05rem "Bricolage Grotesque",sans-serif;margin:20px 0 0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative;margin:0}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:12px 4px;border:2px solid var(--line);border-radius:10px;font-weight:600;background:var(--paper)}
.opt input:checked+span.uk{border-color:var(--uk);background:var(--uk-soft)}
.opt input:checked+span.local{border-color:var(--local);background:var(--local-soft)}
.opt input:checked+span.both{border-color:var(--ink);background:linear-gradient(90deg,var(--uk-soft) 50%,var(--local-soft) 50%)}
.opt input:focus-visible+span{outline:3px solid var(--uk);outline-offset:2px}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:18px}
.go,.del{padding:14px;border-radius:12px;font:700 15px "Instrument Sans",sans-serif;cursor:pointer}
.go{border:0;background:var(--ink);color:var(--paper)}
.del{border:1.5px solid var(--bad);background:transparent;color:var(--bad)}
button[disabled]{opacity:.55;cursor:wait}
.note{margin-top:10px;font-size:14px;min-height:1.4em}
.note.ok{color:var(--ok)} .note.err{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.errbox{background:#FDE7E5;color:var(--bad);padding:12px 14px;border-radius:10px;font-size:14px}
@media(prefers-color-scheme:dark){.errbox{background:#4A1F1C}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Manage applicants</h1>

  <div class="tabs">
    <a class="tab" href="index.html" aria-selected="false">Add applicant</a>
    <a class="tab" href="profiles.html" aria-selected="false">Profiles</a>
    <a class="tab" href="manage.html" aria-selected="true">Manage</a>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search name, email or number" aria-label="Search applicants">
    <select id="sf" aria-label="Filter by status">
      <option value="all">All applicants</option>
      <option value="notatt">Not attended</option>
      <option value="att">Attended</option>
      <option value="pending">Result pending</option>
      <option value="Pass">Passed</option>
      <option value="Fail">Failed</option>
    </select>
  </div>

  <div id="catalog"><p class="empty">Loading…</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, COLLECTION } from "./firebase-config.js";

const $ = id => document.getElementById(id);
let db = null, people = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const withTimeout = p => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000))]);
const camp = p => (p.c.UK && p.c.Local) ? "Both" : p.c.UK ? "UK" : "Local";
const status = p => (p.attended ? "Attended" : "Not attended") + " • " + p.result;

function friendlyError(e) {
  const code = e.code || "";
  if (code === "permission-denied") return "Firebase refused this (permission-denied). In Firebase Console → Firestore → Rules, allow read, update and delete on “" + COLLECTION + "”.";
  if (code === "not-found") return "That applicant no longer exists in Firebase.";
  if (code === "failed-precondition") return "Firestore database not found. In Firebase Console → Build → Firestore Database, click Create database.";
  if (code === "unavailable" || e.message === "timeout") return "Couldn’t reach Firebase within 12 seconds. Check your internet and try again.";
  return "Failed: " + (code || e.message || e);
}

function fail(text) {
  $("stats").replaceChildren();
  $("catalog").innerHTML = '<div class="errbox">' + esc(text) + "</div>";
}

function renderStats() {
  const t = people.length;
  const both = people.filter(p => p.c.UK && p.c.Local).length;
  const uk = people.filter(p => p.c.UK && !p.c.Local).length;
  const local = people.filter(p => p.c.Local && !p.c.UK).length;
  const att = people.filter(p => p.attended).length;
  const pass = people.filter(p => p.result === "Pass").length;
  const tile = (n, l, c) => `<div class="stat ${c || ""}"><b>${n}</b><span>${l}</span></div>`;
  $("stats").innerHTML = tile(t, "Total") + tile(uk, "UK only", "uk") + tile(local, "Local only", "local") +
    tile(both, "Both") + tile(att, "Attended") + tile(pass, "Passed");
}

function matches(p) {
  const q = $("q").value.trim().toLowerCase();
  if (q && ![p.name, p.surname, p.email, p.number].join(" ").toLowerCase().includes(q)) return false;
  const f = $("sf").value;
  if (f === "notatt") return !p.attended;
  if (f === "att") return p.attended;
  if (f === "pending") return p.result === "Pending";
  if (f === "Pass" || f === "Fail") return p.result === f;
  return true;
}

const opts = (n, sel, unit) => Array.from({length: n}, (_, i) =>
  `<option value="${i}" ${i === sel ? "selected" : ""}>${i} ${unit}${i === 1 ? "" : "s"}</option>`).join("");

function card(p) {
  const res = ["Pending", "Pass", "Fail"].map(r => `<option ${r === p.result ? "selected" : ""}>${r}</option>`).join("");
  const ck = v => camp(p) === v ? "checked" : "";
  return `<details data-id="${esc(p.id)}">
  <summary>
    <span class="nm">${esc(p.surname)}, ${esc(p.name)}<small class="st">${esc(status(p))}</small></span>
    <span class="camps"><span class="chip uk ${p.c.UK ? "on" : ""}">${p.c.UK ? "UK" : "UK – no"}</span><span class="chip local ${p.c.Local ? "on" : ""}">${p.c.Local ? "Local" : "Local – no"}</span></span>
  </summary>
  <div class="detail">
    <div class="track">
      <label class="sw"><input type="checkbox" data-act="att" ${p.attended ? "checked" : ""}> Attended interview</label>
      <div><label>Result</label><select data-act="res">${res}</select></div>
    </div>
    <h3 class="sub">Edit details</h3>
    <form data-act="edit" novalidate>
      <div class="row">
        <div><label>Name</label><input name="name" value="${esc(p.name)}" required></div>
        <div><label>Surname</label><input name="surname" value="${esc(p.surname)}" required></div>
      </div>
      <label>Address</label><input name="address" value="${esc(p.address)}" required>
      <div class="row">
        <div><label>Phone number</label><input name="number" type="tel" value="${esc(p.number)}" required></div>
        <div><label>Email</label><input name="email" type="email" value="${esc(p.email)}" required></div>
      </div>
      <div class="row">
        <div><label>Years</label><select name="years">${opts(31, p.experienceYears || 0, "year")}</select></div>
        <div><label>Months</label><select name="months">${opts(12, p.experienceMonths || 0, "month")}</select></div>
      </div>
      <label>Work experience</label><textarea name="experience" required>${esc(p.experience)}</textarea>
      <label>Campaign</label>
      <div class="opts">
        <label class="opt"><input type="radio" name="campaign" value="UK" ${ck("UK")}><span class="uk">UK</span></label>
        <label class="opt"><input type="radio" name="campaign" value="Local" ${ck("Local")}><span class="local">Local</span></label>
        <label class="opt"><input type="radio" name="campaign" value="Both" ${ck("Both")}><span class="both">Both</span></label>
      </div>
      <div class="btns">
        <button class="go" type="submit">Save changes</button>
        <button class="del" type="button" data-act="del">Delete</button>
      </div>
      <div class="note" role="status" aria-live="polite"></div>
    </form>
  </div>
</details>`;
}

function render() {
  const open = new Set([...document.querySelectorAll("#catalog details[open]")].map(d => d.dataset.id));
  renderStats();
  const list = people.filter(matches);
  if (!list.length) {
    $("catalog").innerHTML = '<p class="empty">' + (people.length ? "No one matches that filter." : "No applicants saved yet. Add one on the first page.") + "</p>";
    return;
  }
  $("catalog").innerHTML = list.map(card).join("");
  document.querySelectorAll("#catalog details").forEach(d => { if (open.has(d.dataset.id)) d.open = true; });
}

function note(det, kind, text) {
  const n = det.querySelector(".note");
  n.className = "note " + kind; n.textContent = text;
}

const cat = $("catalog");

cat.addEventListener("change", async e => {
  const act = e.target.dataset.act;
  if (act !== "att" && act !== "res") return;
  const det = e.target.closest("details");
  const p = people.find(x => x.id === det.dataset.id);
  const change = act === "att" ? { attended: e.target.checked } : { result: e.target.value };
  try {
    await withTimeout(updateDoc(doc(db, COLLECTION, p.id), change));
    Object.assign(p, change);
    det.querySelector(".st").textContent = status(p);
    renderStats();
    note(det, "ok", "Saved");
  } catch (err) {
    console.error(err);
    if (act === "att") e.target.checked = p.attended; else e.target.value = p.result;
    note(det, "err", friendlyError(err));
  }
});

cat.addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, det = form.closest("details");
  const p = people.find(x => x.id === det.dataset.id);
  const fd = new FormData(form);
  const v = k => String(fd.get(k) || "").trim();
  const campaign = fd.get("campaign");
  if (!v("name") || !v("surname") || !v("address") || !v("number") || !v("email") || !v("experience"))
    return note(det, "err", "Please fill in every field.");
  if (!/^\S+@\S+\.\S+$/.test(v("email"))) return note(det, "err", "Enter a valid email address.");
  const change = {
    name: v("name"), surname: v("surname"), address: v("address"), number: v("number"), email: v("email"),
    experienceYears: +fd.get("years"), experienceMonths: +fd.get("months"), experience: v("experience"),
    campaign, campaigns: { UK: campaign !== "Local", Local: campaign !== "UK" }
  };
  const btn = form.querySelector(".go");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await withTimeout(updateDoc(doc(db, COLLECTION, p.id), change));
    Object.assign(p, change, { c: change.campaigns });
    people.sort(byName);
    render();
    const again = document.querySelector(`#catalog details[data-id="${CSS.escape(p.id)}"]`);
    if (again) note(again, "ok", "Changes saved");
  } catch (err) {
    console.error(err);
    note(det, "err", friendlyError(err));
    btn.disabled = false; btn.textContent = "Save changes";
  }
});

cat.addEventListener("click", async e => {
  if (e.target.dataset.act !== "del") return;
  const det = e.target.closest("details");
  const p = people.find(x => x.id === det.dataset.id);
  if (!confirm("Delete " + p.name + " " + p.surname + "? This can’t be undone.")) return;
  e.target.disabled = true;
  try {
    await withTimeout(deleteDoc(doc(db, COLLECTION, p.id)));
    people = people.filter(x => x.id !== p.id);
    render();
  } catch (err) {
    console.error(err);
    e.target.disabled = false;
    note(det, "err", friendlyError(err));
  }
});

$("q").addEventListener("input", render);
$("sf").addEventListener("change", render);

const byName = (a, b) =>
  ((a.surname || "") + (a.name || "")).localeCompare((b.surname || "") + (b.name || ""), undefined, { sensitivity: "base" });

async function load() {
  if (JSON.stringify(firebaseConfig).includes("PASTE_"))
    return fail("Firebase isn’t connected yet. Paste your Firebase config into firebase-config.js.");
  try {
    db = getFirestore(initializeApp(firebaseConfig));
    const snap = await withTimeout(getDocs(collection(db, COLLECTION)));
    people = snap.docs.map(d => {
      const p = d.data();
      p.id = d.id;
      p.c = p.campaigns || { UK: p.campaign !== "Local", Local: p.campaign !== "UK" };
      p.attended = !!p.attended;
      p.result = p.result || "Pending";
      return p;
    }).sort(byName);
    render();
  } catch (e) {
    console.error("Firestore read error:", e);
    fail(friendlyError(e));
  }
}
load();
</script>
</body>
</html>
